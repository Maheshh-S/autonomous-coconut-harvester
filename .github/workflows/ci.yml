# CI: static gates only (split-deploy plan Phase 5).
# No weights, DB data, or browsers needed. Playwright stays an attended
# local gate (verify_*.js require live servers + seeded DB).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile backend
        run: python -m py_compile $(git ls-files 'backend/*.py')
      - name: Parse-check backend (DB-free)
        # Importing main runs init_db, which needs DATABASE_URL; an AST
        # parse keeps this gate DB-free while catching syntax breakage.
        run: python -c "import ast,sys; [ast.parse(open(f).read()) for f in sys.argv[1:]]" $(git ls-files 'backend/*.py')

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local dev (node 22 / npm 11): the lockfile is generated
          # by npm 11 and `npm ci` under npm 10 rejects it as out-of-sync.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # No `npm run lint`: eslint 9 flags pre-existing patterns repo-wide
      # (set-state-in-effect, no-explicit-any). Repo verification policy is
      # tsc + build + Playwright (AGENTS.md); lint stays a local opt-in.
      - run: npm run i18n:check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

  docker-shape:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfile + compose shape
        # Weights are gitignored so CI has no .pt files; this only proves
        # the Dockerfiles parse and the compose file is valid YAML shape.
        run: |
          docker build --help >/dev/null
          python -c "import yaml" 2>/dev/null || pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('compose.yml')); print('compose OK')"
