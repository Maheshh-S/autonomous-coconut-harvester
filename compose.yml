# Local smoke only: boots the backend image against the real Neon DB and
# proves /health green. Production deploys on Render (see spec); the
# frontend stays on local `npm run dev` or Vercel.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Persist survey/inspection uploads across container restarts locally.
      - veraxis-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  veraxis-uploads:
